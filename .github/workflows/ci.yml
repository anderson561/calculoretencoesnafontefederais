name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Rodar testes
        shell: bash
        run: |
          set +e
          pytest -rA --tb=long -p no:cacheprovider > test_output.txt 2>&1
          code=$?
          {
            echo "### pytest — ${{ matrix.os }} (exit $code)"
            echo '```'
            cat test_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
