name: Release

# Dispara ao publicar uma tag de versão, ex.: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # necessário para criar a Release e anexar o .exe

jobs:
  build-exe:
    name: Compilar .exe e publicar Release
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -q

      - name: Gerar executável
        run: powershell -ExecutionPolicy Bypass -File build-exe.ps1

      - name: Publicar Release com o .exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/calculo-retencoes.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
